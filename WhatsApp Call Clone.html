<html lang="en"><head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #111b21; /* Dark background for the outside area */
        }

        /* Hide scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            display: none;
        }

        /* Phone Container styling */
        .phone-mockup {
            width: 360px;
            height: 780px;
            background-color: #0b141a; /* WhatsApp dark mode default */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 10px #1a1a1a;
            border-radius: 40px;
            overflow: hidden;
            position: relative;
        }

        /* Focus outline removal for editable text */
        [contenteditable="true"]:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 0 4px;
        }

        /* Background overlay */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.15; /* Subtle background */
            pointer-events: none;
        }

        /* Main content z-index */
        .content-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
    </style>

    <script>
        // 1. Real-time Device Clock (Top Left)
        function updateDeviceTime() {
            const timeEl = document.getElementById('device-time');
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            timeEl.textContent = `${hours}.${minutes}`;
        }
        setInterval(updateDeviceTime, 1000);
        updateDeviceTime();

        // 2. Call Duration Timer Logic
        const timerElement = document.getElementById('call-timer');
        let timerSeconds = 0;
        let timerInterval = null;

        // Parse a time string like "5.01.27" or "12.34" into total seconds
        function parseTime(timeStr) {
            // Replace colons with dots just in case user typed colons
            timeStr = timeStr.replace(/:/g, '.');
            const parts = timeStr.split('.').map(num => parseInt(num) || 0);
            
            if (parts.length === 3) {
                return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
            } else if (parts.length === 2) {
                return (parts[0] * 60) + parts[1];
            } else if (parts.length === 1) {
                return parts[0];
            }
            return 0;
        }

        // Format total seconds into "H.MM.SS" or "M.SS"
        function formatTime(totalSeconds) {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;

            let timeString = "";
            if (h > 0) {
                timeString += h + ".";
                timeString += m.toString().padStart(2, '0') + ".";
            } else {
                timeString += m + ".";
            }
            timeString += s.toString().padStart(2, '0');
            return timeString;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerSeconds++;
                timerElement.textContent = formatTime(timerSeconds);
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        // Initialize timer from default text
        timerSeconds = parseTime(timerElement.textContent);
        startTimer();

        // Pause timer when user clicks to edit it
        timerElement.addEventListener('focus', () => {
            stopTimer();
        });

        // Resume timer and update value when user clicks away
        timerElement.addEventListener('blur', () => {
            let newTimeStr = timerElement.textContent.trim();
            timerSeconds = parseTime(newTimeStr);
            timerElement.textContent = formatTime(timerSeconds); // reformat purely
            startTimer();
        });

        // Prevent "Enter" key from creating new lines in contenteditable
        document.querySelectorAll('[contenteditable="true"]').forEach(el => {
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    el.blur();
                }
            });
        });

        // 3. Profile Picture Upload Logic
        const profileInput = document.getElementById('profile-upload');
        const profileImg = document.getElementById('profile-img');

        profileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    profileImg.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>

</body></html>
